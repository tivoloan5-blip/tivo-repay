<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Demo</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:#f3f3f3}.title{background:#ff8500;color:#fff;text-align:center;font-size:36px;font-weight:bold;padding:14px}.container{max-width:500px;margin:auto;padding:15px}.amount{text-align:center}.price{color:#ff8500;font-size:46px;font-weight:bold;margin:8px 0}.timer{color:red;font-size:28px;margin:8px 0}.qr{text-align:center;margin:10px}.qr img{width:150px;height:150px}.pay-box{background:#fff;border:1px solid #ddd;border-radius:15px;padding:12px;margin-top:12px;display:flex;justify-content:space-between;align-items:center}.pay-left{display:flex;align-items:center;gap:12px}.pay-left img{width:55px;height:55px;object-fit:contain}.pay-name{font-size:21px;font-weight:bold}.pay-btn,.copy-btn{background:#ff8500;color:#fff;border:0;cursor:pointer}.pay-btn{padding:9px 18px;border-radius:7px}.manual{background:#fff;margin-top:15px;padding:15px;border-radius:15px}.blue{color:#4f7fe8;font-weight:bold;font-size:14px}.upi-box{display:flex;margin-top:8px}.upi-box input{flex:1;padding:10px;font-size:15px;border:1px solid #ccc;border-radius:5px 0 0 5px}.copy-btn{padding:0 15px;border-radius:0 5px 5px 0}.tip{color:orange;margin:10px 0;font-size:13px}.ref-input{width:100%;padding:10px;font-size:16px;margin-top:8px;border:1px solid #ccc;border-radius:5px}.submit-btn{width:100%;background:#ff8500;color:#fff;border:0;padding:12px;font-size:18px;border-radius:8px;margin-top:10px}.submit-btn:disabled{background:#999;cursor:not-allowed}.notice{background:#fff;margin-top:15px;padding:12px;border-radius:10px;font-size:12px;color:#666}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.card{background:#fff;border-radius:12px;padding:22px;max-width:360px;width:100%;text-align:center}.card h3{margin-bottom:10px;color:#ff8500}.card p{white-space:pre-line;line-height:1.5;font-size:14px;margin-bottom:15px}.close{background:#ff8500;color:#fff;border:0;padding:9px 25px;border-radius:6px}
</style></head><body>
<div class="title">payment</div><div class="container"><div class="amount"><div class="price" id="price">₹0.00</div><div class="timer" id="timer">08:00</div><div style="font-size:14px">Scan QR to pay</div></div><div class="qr"><img id="qrCode" alt="Demo QR"></div><h3 style="font-size:16px">Choose payment method</h3>
<div class="pay-box"><div class="pay-left"><img src="https://pwebassets.paytm.com/commonwebassets/paytmweb/header/images/logo_new.svg" alt="Paytm"><div class="pay-name">Paytm</div></div><button class="pay-btn" id="paytmBtn">Pay</button></div>
<div class="pay-box"><div class="pay-left"><img src="https://download.logo.wine/logo/PhonePe/PhonePe-Logo.wine.png" alt="PhonePe"><div class="pay-name">PhonePe</div></div><button class="pay-btn" id="phonepeBtn">Pay</button></div>
<div class="manual"><div class="blue">1. Copy the below given UPI</div><div class="upi-box"><input id="upi" readonly><button class="copy-btn" id="copyBtn">Copy</button></div><div class="tip">Tip: This is a demonstration page.</div><div class="blue">2. Enter a 12 digit demo reference number</div><input class="ref-input" id="utr" maxlength="12" inputmode="numeric" placeholder="Enter 12 Digit reference"><button class="submit-btn" id="submitBtn" disabled>SUBMIT DEMO</button></div><div class="notice">Demo only. This page does not process, verify, or confirm real payments.</div></div>
<div class="modal" id="modal"><div class="card"><h3 id="modalTitle">Demo</h3><p id="modalText"></p><button class="close" id="closeModal">OK</button></div></div>
<script>
let globalAmount="0.00",globalUPI="";
function getParams(){const p=new URLSearchParams(location.search),a=p.get("amount"),u=p.get("upi");if(a){const n=Number(a.replace(/[^0-9.]/g,""));if(Number.isFinite(n)&&n>=0)globalAmount=n.toFixed(2)}if(u)globalUPI=u.trim();document.getElementById("price").textContent="₹"+globalAmount;document.getElementById("upi").value=globalUPI;updateQR()}
function getUPILink(){return "upi://pay?pa="+encodeURIComponent(globalUPI)+"&pn="+encodeURIComponent("Payment Demo")+"&am="+encodeURIComponent(globalAmount)+"&cu=INR"}
function updateQR(){const q=document.getElementById("qrCode");if(!globalUPI){q.removeAttribute("src");return}q.src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="+encodeURIComponent(getUPILink())}
function modal(t,x){document.getElementById("modalTitle").textContent=t;document.getElementById("modalText").textContent=x;document.getElementById("modal").classList.add("show")}
document.getElementById("closeModal").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("copyBtn").onclick=async()=>{if(!globalUPI)return modal("Demo","No UPI was supplied in the URL.");try{await navigator.clipboard.writeText(globalUPI)}catch(e){const x=document.getElementById("upi");x.removeAttribute("readonly");x.select();document.execCommand("copy");x.setAttribute("readonly","")}modal("Copied","Demo UPI copied to clipboard.")};
function app(n){if(!globalUPI)return modal(n+" Demo","No UPI was supplied in the URL.");modal(n+" Demo","Amount: ₹"+globalAmount+"\nUPI: "+globalUPI+"\n\nDemo action only; no real payment is initiated or confirmed.")}
document.getElementById("paytmBtn").onclick=()=>app("Paytm");document.getElementById("phonepeBtn").onclick=()=>app("PhonePe");
const utr=document.getElementById("utr"),submit=document.getElementById("submitBtn");utr.oninput=()=>{utr.value=utr.value.replace(/\D/g,"").slice(0,12);submit.disabled=!/^\d{12}$/.test(utr.value)};submit.onclick=()=>modal("Demo submitted","The reference was accepted by this demo UI only. No real payment was verified.");
let sec=480;setInterval(()=>{document.getElementById("timer").textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");if(sec>0)sec--},1000);window.addEventListener("DOMContentLoaded",getParams);
</script></body></html>
